# Scrapes the API's Prometheus-format /metrics endpoint (see
# apps/api/src/observability/metrics.ts) - the local counterpart of the
# CloudWatch dashboards/alarms in infra/terraform/dashboards.tf.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: shopsphere-api
    static_configs:
      - targets: ["api:4000"]
    metrics_path: /metrics
