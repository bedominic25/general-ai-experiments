# Local counterpart of the AWS ADOT sidecar described in infra/README.md.
# Receives OTLP traces from apps/api/src/observability/tracing.ts and just
# logs them by default - swap the exporter for `otlphttp`/`awsxray` to ship
# them somewhere real.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
