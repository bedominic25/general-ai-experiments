name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: "20"

jobs:
  typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w apps/api
      - run: npm run typecheck

  unit-tests:
    name: API unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w apps/api
      - run: npm run test:unit

  e2e:
    name: Playwright (web, mobile-web, REST, GraphQL, retrieval, LLM regression)
    runs-on: ubuntu-latest
    needs: [typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w apps/api
      - run: npx playwright install --with-deps chromium
        working-directory: tests
      - run: npm run test:e2e
        working-directory: tests
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 14

  docker-build:
    name: Build container images (no push)
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t shopsphere-api:ci apps/api
      - run: docker build -t shopsphere-web:ci apps/web

  k6-smoke:
    name: k6 perf smoke test (product search)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w apps/api
      - name: Seed a disposable test database
        working-directory: apps/api
        run: |
          npx prisma migrate deploy
          npx tsx prisma/seed.ts
        env:
          DATABASE_URL: "file:./test.db"
      - name: Start API (mock LLM provider)
        working-directory: apps/api
        run: nohup npx tsx src/server.ts > /tmp/api.log 2>&1 &
        env:
          DATABASE_URL: "file:./test.db"
          LLM_PROVIDER: mock
          PORT: "4000"
      - name: Wait for API health
        run: npx wait-on http://localhost:4000/health --timeout 30000
      - uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/perf/k6/product-search.js
          flags: --vus 5 --duration 15s
      - if: always()
        run: cat /tmp/api.log

  terraform-validate:
    name: terraform fmt & validate (no apply)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
