name: shopsphere

# Local/CI topology that mirrors production (see infra/terraform for the AWS
# equivalent: RDS-with-pgvector <-> postgres, ECS Fargate <-> api, S3+CloudFront <-> web).
# Not used by default local dev (which runs API against SQLite for zero setup) -
# use this when you want to exercise the real pgvector retrieval path, e.g.:
#   docker compose up --build

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_USER: shopsphere
      POSTGRES_PASSWORD: shopsphere
      POSTGRES_DB: shopsphere
    ports:
      - "5432:5432"
    volumes:
      - shopsphere-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopsphere"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://shopsphere:shopsphere@postgres:5432/shopsphere"
      JWT_SECRET: "dev-only-change-me"
      LLM_PROVIDER: "mock"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:4000"
        VITE_GRAPHQL_URL: "http://localhost:4000/graphql"
    depends_on:
      - api
    ports:
      - "5173:80"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

volumes:
  shopsphere-pgdata:
