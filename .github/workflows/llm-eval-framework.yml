name: LLM Evaluation Suite

on:
  push:
    branches: [main]
    paths: ["llm-eval-framework/**", ".github/workflows/llm-eval-framework.yml"]
  pull_request:
    paths: ["llm-eval-framework/**", ".github/workflows/llm-eval-framework.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: llm-eval-framework

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: llm-eval-framework/package-lock.json

      - run: npm ci

      # No `playwright install` step: this suite only uses Playwright's
      # request-context (API testing) feature, which needs no browser binary.
      - run: npm test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-reports
          path: |
            llm-eval-framework/playwright-report/
            llm-eval-framework/reports/
          retention-days: 14
