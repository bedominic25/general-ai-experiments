name: ETL Data Quality

on:
  push:
    branches: [main]
    paths: ["etl-data-quality/**", ".github/workflows/etl-data-quality.yml"]
  pull_request:
    paths: ["etl-data-quality/**", ".github/workflows/etl-data-quality.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: etl-data-quality

jobs:
  test-linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl-data-quality/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest --html=reports/report-linux.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report-linux
          path: etl-data-quality/reports/
          retention-days: 14

  # Windows runners ship with PostgreSQL installed but stopped (user postgres, password root).
  test-windows:
    runs-on: windows-latest
    env:
      DATABASE_URL: postgresql://postgres:root@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl-data-quality/requirements.txt
      - name: Start PostgreSQL
        shell: pwsh
        run: |
          $pg = Get-Service -Name "postgresql*"
          Set-Service -InputObject $pg -Status Running -StartupType Automatic
          & "$env:PGBIN\pg_isready.exe"
      - run: pip install -r requirements.txt
      - run: pytest --html=reports/report-windows.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report-windows
          path: etl-data-quality/reports/
          retention-days: 14
